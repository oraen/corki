[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corki-adaptor"
version = "0.1.0"
description = "Standalone loopback subscription gateway with OpenAI and Qoder adapters."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
    "truststore>=0.10.4,<0.11",
    "cryptography>=46,<47",
]

[project.scripts]
corki-adaptor = "corki_adaptor.gateway:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11"]

[tool.setuptools]
packages = ["corki_adaptor", "corki_adaptor.openai", "corki_adaptor.qoder"]

[tool.setuptools.package-dir]
corki_adaptor = "src"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["corki_adaptor"]
