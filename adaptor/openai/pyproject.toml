[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "corki-openai-gateway"
version = "0.1.0"
description = "Standalone loopback OpenAI protocol gateway for Codex login credentials."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
    "truststore>=0.10.4,<0.11",
]

[project.scripts]
corki-openai-gateway = "corki_openai_gateway.gateway:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/corki_openai_gateway"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "bin", "README.md", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
