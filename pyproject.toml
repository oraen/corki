[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "corki"
version = "0.1.0"
description = "A maintainable Python and LangGraph reimplementation of the Codex CLI experience."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Corki contributors" }]
dependencies = [
    "httpx>=0.28,<0.29",
    "httpcore>=1.0,<1.1",
    "keyring>=25,<26",
    "anyio>=4.15,<5",
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=3,<4",
    "openpyxl>=3.1,<4",
    "pdfplumber>=0.11,<1",
    "pillow>=12,<13",
    "prompt-toolkit>=3.0,<4",
    "pypdf>=5,<7",
    "pyyaml>=6.0,<7",
    "reportlab>=4,<5",
    "rich>=13,<15",
    "snowballstemmer==2.2.0",
    "tomlkit>=0.13,<1",
    "wasmtime==48.0.0",
    "websockets>=16,<17",
]

[project.optional-dependencies]
code-mode = ["quickjs-ng==0.16.2.1"]
dev = [
    "pexpect>=4.9,<5",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.11",
]

[project.scripts]
corki = "corki.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/corki"]

[tool.hatch.build.hooks.custom]
path = "native/sandbox/hatch_build.py"

# Prompt Markdown stays at the repository root for easy review, but is copied
# into the installed ``corki`` package so ``importlib.resources`` can find it.
[tool.hatch.build.targets.wheel.force-include]
"prompts" = "corki/_prompt_templates"
"skills" = "corki/_builtin_skills"

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "examples",
    "prompts",
    "skills",
    "README.md",
    "development.md",
    "THIRD_PARTY_NOTICES.md",
    "native/mcp_regex",
    "native/mcp_url",
    "native/sandbox",
    "pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
# Bundled skills are imported third-party/runtime assets with their own style;
# lint Corki's implementation and tests without mechanically rewriting them.
exclude = [".git", ".idea", ".venv", "skills/**"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
