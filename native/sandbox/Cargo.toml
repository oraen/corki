[package]
name = "corki-sandbox"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
codex-apply-patch = { path = "reference/codex-rs/apply-patch" }
codex-exec-server = { path = "reference/codex-rs/exec-server" }
codex-config = { path = "reference/codex-rs/config" }
codex-context-fragments = { path = "reference/codex-rs/context-fragments" }
codex-prompts = { path = "reference/codex-rs/prompts" }
codex-execpolicy = { path = "reference/codex-rs/execpolicy" }
codex-features = { path = "reference/codex-rs/features" }
codex-network-proxy = { path = "reference/codex-rs/network-proxy" }
codex-utils-absolute-path = { path = "reference/codex-rs/utils/absolute-path" }
codex-sandboxing = { path = "reference/codex-rs/sandboxing" }
codex-shell-command = { path = "reference/codex-rs/shell-command" }
codex-protocol = { path = "reference/codex-rs/protocol" }
codex-utils-path-uri = { path = "reference/codex-rs/utils/path-uri" }
base64 = "=0.22.1"
libc = "=0.2.186"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["arbitrary_precision", "raw_value"] }
shlex = "=1.3.0"
sha1 = "=0.10.6"
similar = "=2.7.0"
tracing = "=0.1.44"
# Keep the parser ABI dependency at the reference lockfile version.
tree-sitter-language = "=0.1.7"
tokio = { version = "1", features = ["rt"] }
# Keep newly reached executor dependencies at the pinned reference lock versions.
axum = "=0.8.8"
clatter = { version = "=2.2.0", default-features = false }
zeroize_derive = "=1.4.3"

[profile.dev]
debug = 0

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 4

[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
